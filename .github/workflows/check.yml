name: Validate PhiloLoom changes

on:
  pull_request:
    branches: [main, design/approved-visual-direction]

# New commits supersede older runs for the same PR. Other PRs remain independent.
concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Cache local philosopher portraits (one-time branch task)
        if: github.head_ref == 'fix/cache-philosopher-portraits'
        run: |
          set -euo pipefail
          git fetch origin fix/cache-philosopher-portraits
          git checkout -B fix/cache-philosopher-portraits FETCH_HEAD
          python scripts/cache_person_portraits.py
          python scripts/optimize_images.py
          git add content/previews/portraits docs/PORTRAIT_SOURCES.md content/optimized content/image-manifest.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Cache 12 curated philosopher portraits and responsive WebP'
            git push origin HEAD:refs/heads/fix/cache-philosopher-portraits
          fi
      - name: Validate content and generated site
        run: |
          python scripts/audit_content.py --summary --strict --report editorial-report.json
          make check
      - name: Upload editorial audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-audit
          path: editorial-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Set up Node.js for browser verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # GitHub's ubuntu-24.04 image already ships with Google Chrome.
      # Test against that browser instead of downloading ~280 MB of Chromium
      # and repeatedly installing its Ubuntu packages on each ephemeral runner.
      - name: Install lightweight Playwright test runner
        run: |
          google-chrome --version
          npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Verify desktop, mobile, search and navigation
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: node tests/visual_smoke.cjs