name: Validate PhiloLoom changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Download LFS content
        run: git lfs pull
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate content and generated site
        run: |
          python scripts/audit_content.py --report editorial-report.json
          make check
      - name: Probe curated resource OG artwork
        continue-on-error: true
        run: |
          python - <<'PY'
          import concurrent.futures, json, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          urls = [
            'https://umozrenie.com/?product_cat=philosophy',
            'https://logosjournal.ru/',
            'https://www.phisci.info/jour',
            'https://www.socionauki.ru/journal/fio/',
            'http://www.vphil.ru/',
            'https://spb.hse.ru/ixtati/',
            'https://iphlib.ru/library',
          ]
          class Metadata(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}
              def handle_starttag(self, tag, attrs):
                  if tag == 'meta':
                      d = dict(attrs)
                      key = d.get('property') or d.get('name')
                      if key:
                          self.meta[key.lower()] = d.get('content','')
          def probe(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (compatible; PhiloLoom/1.0)'})
                  with urllib.request.urlopen(req, timeout=9) as response:
                      document = response.read(500000).decode('utf-8','replace')
                      final = response.url
                  p = Metadata(); p.feed(document)
                  image = p.meta.get('og:image') or p.meta.get('twitter:image') or ''
                  return {'url':url, 'image':urljoin(final,image) if image else '', 'description':p.meta.get('og:description','')[:120]}
              except Exception as e:
                  return {'url':url, 'error':str(e)[:100]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool:
              for result in pool.map(probe,urls):
                  print('PREVIEW_PROBE='+json.dumps(result,ensure_ascii=False))
          PY
