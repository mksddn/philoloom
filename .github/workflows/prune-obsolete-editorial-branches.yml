name: Prune obsolete Philoloom branches (one-time)
on:
  push:
    branches:
      - editorial-audit-topic-intros
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'mksddn/philoloom' && github.ref == 'refs/heads/editorial-audit-topic-intros'
    runs-on: ubuntu-latest
    steps:
      - name: Remove four closed draft branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            feature/knowledge-map-and-content-workflow \
            feature/knowledge-atlas \
            feature/editorial-content-pipeline \
            feature/knowledge-map-and-publishing
          do
            echo "Deleting obsolete branch: $branch"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done
