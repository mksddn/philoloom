name: Repair nested source links
on:
  push:
    branches: [refactor/slug-native-content]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[skip link repair]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - run: |
          python3 scripts/repair_source_links.py
          rm scripts/repair_source_links.py .github/workflows/repair-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair nested links and preserve reciprocal graph [skip link repair]"
          git push origin HEAD:refactor/slug-native-content
